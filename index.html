<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi Premium Gold - GOLTOGEL</title>
<style>
body {
  background: #000000;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  min-height: 100vh;
  padding: 10px;
  font-family: Arial, sans-serif;
  margin: 0;
  box-sizing: border-box;
}

/* --- DROPDOWN PASARAN --- */
.outside-select {
  margin-bottom: 12px;
  width: 100%;
  max-width: 1050px;
}

select#pasaran {
  width: 100%;
  padding: 12px;
  border: 2px solid #ffcc00;
  font-weight: bold;
  background: #000;
  color: #ffcc00;
  border-radius: 0;
  font-size: 16px;
  outline: none;
  text-align: center;
  text-align-last: center;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
  text-transform: uppercase;
}

/* --- FRAME UTAMA --- */
.frame {
  width: 100%;
  max-width: 1050px;
  background: url('https://files.catbox.moe/brmmb9.jpg') no-repeat center;
  background-size: cover;
  padding: 15px;
  border: 4px solid #ffcc00;
  box-shadow: 0 0 30px #000;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box;
}

.header-top {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border-bottom: 3px solid rgba(255, 204, 0, 0.8);
  padding-bottom: 10px;
  text-align: center;
}

.logo {
  width: 180px;
  filter: drop-shadow(0 0 10px #ffcc00);
}

.title-center {
  color: #ffffff;
  font-size: 24px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 15px #ffcc00, 2px 2px 4px #000;
}

#tanggal {
  color: #ffffff;
  font-weight: bold;
  font-size: 15px;
  text-shadow: 0 0 10px #ffcc00, 1px 1px 2px #000;
  text-align: center;
}

.main-content {
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
}

.left-column {
  width: 100%;
  display: flex;
  flex-direction: row;
  justify-content: space-around;
  gap: 10px;
  align-items: center;
}

.box-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* --- LOGO PASARAN --- */
#pasaran-logo {
  width: 130px;
  height: 130px;
  object-fit: contain;
  background: transparent;
  border: none;
  padding: 0;
  filter: brightness(1.4) contrast(1.3) drop-shadow(0 0 15px rgba(255, 204, 0, 0.9));
  transition: width 0.2s, height 0.2s;
}

/* --- LOGO SHIO --- */
#shio-img {
  width: 130px;
  height: 130px;
  object-fit: contain;
  background: transparent;
  border: none;
  padding: 0;
  filter: brightness(1.05) contrast(1.05) drop-shadow(0 0 8px rgba(255, 204, 0, 0.5));
  transition: width 0.2s, height 0.2s;
}

.label-box {
  color: #ffffff;
  font-size: 14px;
  font-weight: bold;
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

#shio-text {
  font-size: 16px;
  color: #ffffff;
  font-weight: 900;
  margin-top: 5px;
  text-align: center;
  text-shadow: 0 0 10px #ffcc00, 2px 2px 4px #000;
}

/* --- TABEL & SYAIR --- */
.right-column {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  background: rgba(0, 0, 0, 0.9);
  overflow: hidden;
  box-shadow: 0 0 15px rgba(0,0,0,0.8);
}

.data-table td {
  padding: 8px 10px;
  border: 1px solid rgba(255, 204, 0, 0.6);
  color: #ffcc00;
  font-weight: bold;
  font-size: 13px;
  text-shadow: 1px 1px 2px #000;
}

.value {
  color: #ffffff !important;
  text-align: center !important;
  letter-spacing: 1px;
  font-size: 14px;
  font-weight: 900;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 1px 1px 2px #000;
}

.syair-box {
  background: rgba(0, 0, 0, 0.9);
  padding: 12px;
  border: 2px solid #ffcc00;
  font-style: italic;
  color: #ffffff;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.4;
  white-space: pre-line;
  text-align: center;
  text-shadow: 1px 1px 2px #000;
  box-shadow: 0 0 15px rgba(0,0,0,0.8);
}

/* --- BAGIAN BAWAH --- */
.footer-links {
  text-align: center;
  margin-top: 5px;
}

.label-dropdown {
  color: #ffffff;
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 5px;
  display: block;
  letter-spacing: 1px;
  text-shadow: 0 0 10px #ffcc00, 1px 1px 2px #000;
}

input#linkAlternatif {
  width: 100%;
  border: none;
  background: transparent;
  color: #ffffff;
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  outline: none;
  text-shadow: 0 0 15px #ffcc00, 2px 2px 4px #000;
  text-transform: uppercase;
}

/* --- PANEL KONTROL UKURAN GAMBAR --- */
.image-controls {
  margin-top: 15px;
  background: rgba(0, 0, 0, 0.9);
  border: 1px solid #ffcc00;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: #ffcc00;
  font-size: 12px;
  font-weight: bold;
  width: 100%;
  max-width: 1050px;
  box-sizing: border-box;
}
.image-controls label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.image-controls input[type="range"] {
  width: 60%;
  cursor: pointer;
  accent-color: #ffcc00;
}

/* Penyesuaian otomatis jika dibuka di Layar Lebar (Tablet / Komputer) */
@media (min-width: 768px) {
  .frame {
    padding: 20px 30px;
    border: 6px solid #ffcc00;
  }
  .header-top {
    flex-direction: row;
    justify-content: space-between;
    text-align: left;
  }
  .logo {
    width: 240px;
  }
  .title-center {
    font-size: 32px;
  }
  #tanggal {
    font-size: 18px;
    text-align: right;
  }
  .main-content {
    flex-direction: row;
    align-items: flex-start;
  }
  .left-column {
    flex: 0 0 260px;
    flex-direction: column;
  }
  #pasaran-logo, #shio-img {
    width: 180px;
    height: 180px;
  }
  #shio-text {
    font-size: 24px;
  }
  .data-table td {
    padding: 9px 12px;
    font-size: 15px;
  }
  .value {
    font-size: 17px;
  }
  .syair-box {
    font-size: 15px;
  }
  input#linkAlternatif {
    font-size: 40px;
  }
  .image-controls {
    flex-direction: row;
    justify-content: center;
    gap: 20px;
  }
  .image-controls label {
    justify-content: flex-start;
  }
  .image-controls input[type="range"] {
    width: 120px;
  }
}
</style>
</head>
<body>

<div class="outside-select">
  <select id="pasaran" onchange="updatePrediksi()"></select>
</div>

<div class="frame">
  <div class="header-top">
    <img class="logo" src="https://i.postimg.cc/1RYhkwyY/download-(2).png">
    <div class="title-center">PREDIKSI JITU</div>
    <div id="tanggal"></div>
  </div>

  <div class="main-content">
    <div class="left-column">
      <div class="box-container">
        <img id="pasaran-logo">
      </div>
      <div class="box-container">
        <img id="shio-img">
        <div id="shio-text">-</div>
      </div>
    </div>

    <div class="right-column">
      <table class="data-table">
        <tr><td>BBFS KUAT</td><td class="value" id="bbfs">-</td></tr>
        <tr><td>ANGKA MAIN</td><td class="value" id="am">-</td></tr>
        <tr><td>4D (BB)</td><td class="value" id="d4">-</td></tr>
        <tr><td>3D (BB)</td><td class="value" id="d3">-</td></tr>
        <tr><td>2D (BB)</td><td class="value" id="d2">-</td></tr>
        <tr><td>COLOK BEBAS</td><td class="value" id="cb">-</td></tr>
        <tr><td>COLOK MACAU</td><td class="value" id="cm">-</td></tr>
        <tr><td>INVEST TWIN</td><td class="value" id="tw">-</td></tr>
      </table>
      <div class="syair-box" id="syair"></div>
    </div>
  </div>

  <div class="footer-links">
    <span class="label-dropdown">LINK ALTERNATIF RESMI</span>
    <input type="text" id="linkAlternatif" value="tempel sini link nya">
  </div>
</div>

<div class="image-controls">
  <label>
    Logo Pasaran: <input type="range" id="sizePasaran" min="80" max="220" value="130" oninput="ubahUkuranPasaran(this.value)"> <span id="valPasaran">130px</span>
  </label>
  <label>
    Logo Shio: <input type="range" id="sizeShio" min="80" max="220" value="130" oninput="ubahUkuranShio(this.value)"> <span id="valShio">130px</span>
  </label>
</div>

<script>
function ubahUkuranPasaran(val) {
  const img = document.getElementById("pasaran-logo");
  img.style.width = val + "px";
  img.style.height = val + "px";
  document.getElementById("valPasaran").innerText = val + "px";
}

function ubahUkuranShio(val) {
  const img = document.getElementById("shio-img");
  img.style.width = val + "px";
  img.style.height = val + "px";
  document.getElementById("valShio").innerText = val + "px";
}

function updateTanggal(){
  const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  const t = new Date();
  t.setDate(t.getDate() + 1); 
  document.getElementById("tanggal").innerHTML = hari[t.getDay()] + ", " + t.getDate() + " " + bulan[t.getMonth()] + " " + t.getFullYear();
}
updateTanggal();

const dataShio = {
  "SHIO : TIKUS": "https://i.postimg.cc/h4yFxxw7/download-(14).png",
  "SHIO : KERBAU": "https://i.postimg.cc/pr1gHb8X/download-(13).png",
  "SHIO : HARIMAU": "https://i.postimg.cc/gJG9yKm6/download-(12).png",

  "SHIO : NAGA": "https://files.catbox.moe/z35a3k.png",
  "SHIO : ULAR": "https://i.postimg.cc/L8qmhv6b/download-(9).png",
  "SHIO : KUDA": "https://i.postimg.cc/3Rj8YRJS/download-(8).png",

const dataPasaran = {
  "BANGKOK ": "https://bangkokpoolstoday.com/assets/img/bangkokpools_logo.png",
  "KING KONG SORE": "https://cdn.areabermain.club/assets/cdn/az9/2024/11/26/20241126/d1f18e378e4a422b41ffe8d03065ce7d/logo-7.png",
  "BRUNEI": "https://bruneipools.com/assets/img/brunei-logo.png",
  "BULLSEYE": "https://cdn.areabermain.club/assets/cdn/az4/2024/08/11/20240811/f07d4e2a6517ef1cea9e2a897e4abb98/nz-bullseye.png",
  "CALIFORNIA": "https://cdn.areabermain.club/assets/cdn/az4/2024/08/11/20240811/7c3b7b0affd7880d2dddf918ba2ac258/calottlogo.png",
  "CAROLINA": "https://files.catbox.moe/4ihsud.png",
  "CHELSEA ": "https://chelseapools.co.uk/assets/img/chelseaPools_logo.png",
  "FLORIDA ": "https://cdn.areabermain.club/assets/cdn/az4/2024/08/11/20240811/a3e564ccb04c2b751ad4fa88c06e39c1/1-removebg-preview.png",
  "HONGKONGLOTTO": "https://cdn.areabermain.club/assets/cdn/az9/2024/12/01/20241201/288e5650fd04b013e764f0e71a9b6e59/hongkong-lotto-1.png",
  "HUAHIN" : "https://huahinlottery.com/assets/img/logo.png",
  "KENTUCKY ": "https://cdn.areabermain.club/assets/cdn/az4/2024/08/11/20240811/a5fafa0102d98ab3959ceb9bb1045729/kl-logo.png",
  "MAGNUM4D": "https://miro.medium.com/1*bGZnkFzRk7x7tfuVTdKyqg.jpeg",

};

const preloadedShio = {};
Object.keys(dataShio).forEach(shioName => {
  const img = new Image();
  img.src = dataShio[shioName];
  preloadedShio[shioName] = img;
});

const preloadedPasaran = {};
Object.keys(dataPasaran).forEach(pasaranName => {
  const img = new Image();
  img.src = dataPasaran[pasaranName];
  preloadedPasaran[pasaranName] = img;
});

const select = document.getElementById("pasaran");
Object.keys(dataPasaran).forEach(nama => {
  let opt = document.createElement("option");
  opt.value = nama;
  opt.text = nama;
  select.appendChild(opt);
});

function rand(l) {
  return Math.floor(Math.random() * Math.pow(10, l)).toString().padStart(l, "0");
}

function set(len, c) {
  return Array.from({length: c}, () => rand(len)).join(" ");
}

function updatePrediksi() {
  const p = select.value;
  if (preloadedPasaran[p]) {
    document.getElementById("pasaran-logo").src = preloadedPasaran[p].src;
  }
  
  const sKeys = Object.keys(dataShio);
  const rS = sKeys[Math.floor(Math.random() * sKeys.length)];
  
  document.getElementById("shio-img").src = preloadedShio[rS].src;
  document.getElementById("shio-text").innerText = rS; 
  
  document.getElementById("bbfs").innerText = Array.from({length: 7}, () => Math.floor(Math.random()*10)).join("");
  document.getElementById("am").innerText = Array.from({length: 5}, () => Math.floor(Math.random()*10)).join("");
  
  document.getElementById("d4").innerText = set(4, 2);
  document.getElementById("d3").innerText = set(3, 2);
  document.getElementById("d2").innerText = set(2, 6);
  
  document.getElementById("cb").innerText = Math.floor(Math.random() * 10) + " / " + Math.floor(Math.random() * 10);
  
  let cmA1 = Math.floor(Math.random()*10), cmA2 = Math.floor(Math.random()*10);
  let cmB1 = Math.floor(Math.random()*10), cmB2 = Math.floor(Math.random()*10);
  document.getElementById("cm").innerText = `${cmA1}${cmA2} / ${cmB1}${cmB2}`;
  
  let t1 = Math.floor(Math.random() * 10);
  let t2 = Math.floor(Math.random() * 10);
  document.getElementById("tw").innerText = `${t1}${t1} / ${t2}${t2}`;
  
  const syairBanyak = [
    "Burung nuri terbang ke dahan,\nSinggah sebentar mencari makan.\nAngka sakti sudah tertahan,\nSemoga JP jadi kenyataan.",
    "Ke pasar baru membeli baju,\nBaju biru indah warnanya.\nNiat hati terus melaju,\nAngka jitu jadi kuncinya.",
    "Malam hari bintang bersinar,\nCahaya terang di ufuk timur.\nMencari angka janganlah gentar,\nRezeki datang saat tertidur.",
    "Kapal berlayar ke tengah laut,\nMenerjang ombak tiada henti.\nAngka main janganlah luput,\nKeberuntungan menanti di hati.",
    "Pergi ke sawah menanam padi,\nPadi tumbuh hijau berseri.\nPasanglah angka dengan teliti,\nKemenangan mutlak sudah memberi.",
    "Awan putih berarak tenang,\nAngin bertiup sepoi bahasa.\nHati mantap pasti menang,\nAngka pilihan jadi kuasa.",
    "Gunung tinggi puncaknya biru,\nTempat bermukim para dewata.\nAngka keramat sudah menunggu,\nMenghapus duka menjadi tawa.",
    "Makan sirih di dalam puan,\nSirih dikunyah bersama teman.\nJP paus jadi impian,\nAngka tarung jadi pedoman.",
    "Surya muncul di balik bukit,\nMenyinari bumi dengan perkasa.\nBukan angka sembarang rakit,\nTapi angka penembus masa.",
    "Bunga mawar merah merona,\nHarum semerbak di taman hati.\nAngka ini sungguh mempesona,\nSiap meledak sebentar nanti."
  ];
   
  document.getElementById("syair").innerText = syairBanyak[Math.floor(Math.random() * syairBanyak.length)];
}

select.selectedIndex = 0;
updatePrediksi();
</script>
</body>
</html>
